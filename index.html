<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <header class="sticky-header">
            <h1>Lista de Tareas</h1>
        </header>
        <section class="form">
            <input type="text" id="new-task" placeholder="New task">
            <button type="submit" class="Add-btn">Add</button>
        </section>
        <section class="task-list">
            <ul id="TaskList">


                <li>
                    <div class="checkbox-contain">
                        <input type="checkbox" id="micheckbox" name="micheckbox">
                        <label for="micheckbox">Task 1</label>
                    </div>
                    <button class="delete">Delete</button>
                </li>

                <li>
                <div class="checkbox-container">
                    <input type="checkbox" id="micheckbox" name="micheckbox">
                    <label for="micheckbox">Task 2</label>
                </div>
                <button class="delete">Delete</button>
                </li>

                <li>
                    <div class="checkbox-container">
                        <input type="checkbox" id="micheckbox" name="micheckbox">
                        <label for="micheckbox">Task 3</label>
                    </div>
                    <button class="delete">Delete</button>
                    </li>

                <li>
                <div class="checkbox-container">
                    <input type="checkbox" id="micheckbox" name="micheckbox">
                    <label for="micheckbox">Task 4</label>
                </div>
                <button class="delete">Delete</button>
                </li>

                <li>
                <div class="checkbox-container">
                    <input type="checkbox" id="micheckbox" name="micheckbox">
                    <label for="micheckbox">Task 5</label>
                </div>
                <button class="delete">Delete</button>
                </li>

                <li>
                <div class="checkbox-container">
                    <input type="checkbox" id="micheckbox" name="micheckbox">
                    <label for="micheckbox">Task 6</label>
                </div>
                <button class="delete">Delete</button>
                </li>

            </ul>
        </section>
        
        <footer>
            <div class="counters">
            <span id="Task-counter">0</span> Tasks 📃
            </div>
            <div class="counters">
            <span id="AlreadyTaskCounter">0</span> Already tasks ✅
            </div>
            <div class="counters">
            <span id="ToDoTasksCounter">0</span> To do tasks❗
            </div>
        </footer>

    </div>
</body>
</html>
